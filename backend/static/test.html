<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Smart Career Recommender API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #667eea;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #764ba2;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f9f9f9;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .error {
            color: #c00;
            background: #fee;
        }
        .success {
            color: #060;
            background: #efe;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Smart Career Recommender API</h1>
    <p><strong>Server URL:</strong> http://localhost:5000</p>
    <div class="test-section">
        <h2>Test 1: Get API Options</h2>
        <button onclick="testGetOptions()">Test /api/options</button>
        <div id="result1" class="result hidden"></div>
    </div>
    <div class="test-section">
        <h2>Test 2: Predict (Introvert Designer)</h2>
        <button onclick="testPredict1()">Test /predict (Desain)</button>
        <div id="result2" class="result hidden"></div>
    </div>
    <div class="test-section">
        <h2>Test 3: Predict (Extrovert Marketer)</h2>
        <button onclick="testPredict2()">Test /predict (Marketing)</button>
        <div id="result3" class="result hidden"></div>
    </div>
    <div class="test-section">
        <h2>Test 4: Get History</h2>
        <button onclick="testHistory()">Test /history</button>
        <div id="result4" class="result hidden"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        function showResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(data, null, 2);
            element.className = 'result ' + (isError ? 'error' : 'success');
            element.style.display = 'block';
        }

        async function testGetOptions() {
            try {
                const response = await fetch(`${API_URL}/api/options`);
                const data = await response.json();
                showResult('result1', data, !data.success);
            } catch (error) {
                showResult('result1', { error: error.message }, true);
            }
        }

        async function testPredict1() {
            try {
                const payload = {
                    interest: "desain",
                    skills: ["canva", "editing"],
                    experience: "pemula",
                    personality: "introvert"
                };
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                showResult('result2', data, !data.success);
            } catch (error) {
                showResult('result2', { error: error.message }, true);
            }
        }

        async function testPredict2() {
            try {
                const payload = {
                    interest: "marketing",
                    skills: ["copywriting", "social media"],
                    experience: "menengah",
                    personality: "extrovert"
                };
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                showResult('result3', data, !data.success);
            } catch (error) {
                showResult('result3', { error: error.message }, true);
            }
        }

        async function testHistory() {
            try {
                const response = await fetch(`${API_URL}/history`);
                const data = await response.json();
                showResult('result4', data, !data.success);
            } catch (error) {
                showResult('result4', { error: error.message }, true);
            }
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            console.log('Test page loaded. Server must be running on http://localhost:5000');
        });
    </script>
</body>
</html>
