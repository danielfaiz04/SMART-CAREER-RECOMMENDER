<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Chat - Smart Career Recommender</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <style>
        /* Specific Chat Styles Override to match Premium UI */
        body {
            height: 100vh;
            overflow: hidden;
            /* Prevent body scroll */
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-layout {
            width: 100%;
            max-width: 800px;
            height: 95vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-2xl);
            border: 1px solid var(--border-color);
            position: relative;
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            overflow: hidden;
            margin: 20px;
        }

        /* Header Area */
        .chat-header-area {
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
        }

        .header-info h1 {
            font-size: 1.1rem;
            margin: 0;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-info p {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .back-btn-icon {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .back-btn-icon:hover {
            background: var(--bg-tertiary);
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: slideInUp 0.3s ease-out;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: var(--bg-gradient);
            color: white;
            border: none;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .message.bot .bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-top-left-radius: 4px;
        }

        .message.user .bubble {
            background: var(--bg-gradient);
            color: white;
            border-top-right-radius: 4px;
        }

        /* Input Area - Container for popup and inputs */
        .input-area-container {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            position: relative;
            z-index: 100;
        }

        /* Floating Suggestions Menu (Popup) - Now absolute relative to input container */
        .suggestions-popup {
            position: absolute;
            bottom: 100%;
            /* Sit right on top of container */
            left: 16px;
            width: 300px;
            max-width: calc(100% - 32px);
            max-height: 400px;
            overflow-y: auto;
            background: var(--bg-card);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-xl);
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 101;
            transform-origin: bottom left;
            animation: slideInUp 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .suggestions-popup.show {
            display: flex;
        }

        .suggestion-item {
            padding: 12px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .suggestion-item:hover {
            background: var(--bg-gradient);
            color: white;
            border-color: transparent;
            transform: translateX(4px);
        }

        .suggestion-icon {
            font-size: 1.2rem;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
            z-index: 102;
        }

        /* Menu Button (Telegram Style) */
        .menu-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--accent-primary);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            z-index: 103;
        }

        .menu-btn:hover,
        .menu-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: transparent;
        }

        .input-box {
            flex: 1;
            display: flex;
            gap: 8px;
            background: var(--bg-primary);
            padding: 6px 6px 6px 16px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            transition: border-color 0.3s;
            align-items: center;
        }

        .input-box:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-box input {
            border: none;
            background: transparent;
            font-size: 0.95rem;
            width: 100%;
            padding: 8px 0;
            color: var(--text-primary);
        }

        .input-box input:focus {
            outline: none;
        }

        .send-btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-gradient);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .send-btn-icon:hover {
            transform: scale(1.05);
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-tertiary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        .theme-toggle {
            top: 20px;
            right: 20px;
            z-index: 200;
        }

        .header-spacer {
            width: 36px;
        }

        @media (max-width: 768px) {
            .chat-layout {
                margin: 0;
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: none;
            }

            .suggestions-popup {
                width: auto;
                left: 10px;
                right: 10px;
                max-width: none;
            }
        }
    </style>
</head>

<body>
    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle Dark Mode">
        <span class="icon">🌙</span>
    </button>

    <div class="chat-layout">
        <!-- Header -->
        <div class="chat-header-area">
            <button class="back-btn-icon" onclick="goBack()" title="Kembali">
                ←
            </button>
            <div class="header-info">
                <h1>Career Advisor AI</h1>
                <p>Online</p>
            </div>
            <div class="header-spacer"></div> <!-- Spacer -->
        </div>

        <!-- Messages -->
        <div class="messages-container" id="messagesContainer">
            <div class="message bot">
                <div class="avatar">🤖</div>
                <div class="bubble">
                    Halo! Saya siap membantu perjalanan karir Anda. 👋<br>
                    Klik tombol <strong>Menu (☰)</strong> di bawah untuk melihat topik yang bisa kita diskusikan.
                </div>
            </div>
        </div>

        <!-- Input Area Container (Popup lives here now) -->
        <div class="input-area-container">
            <!-- Floating Suggestions Menu -->
            <div id="suggestionsPopup" class="suggestions-popup">
                <!-- Populated by JS -->
            </div>

            <div class="input-wrapper">
                <button class="menu-btn" id="menuBtn" type="button" title="Open Menu">
                    ☰
                </button>
                <div class="input-box">
                    <input type="text" id="chatInput" placeholder="Ketik pesan..." autocomplete="off">
                    <button class="send-btn-icon" id="sendBtn" type="button" onclick="sendMessage()">
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const suggestionsPopup = document.getElementById('suggestionsPopup');
        const menuBtn = document.getElementById('menuBtn');

        // Force explicit click handler
        menuBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            toggleMenu();
        });

        // Context Management
        const jobContextRaw = sessionStorage.getItem('chatJobContext');
        let contextData = null;

        if (jobContextRaw) {
            contextData = JSON.parse(jobContextRaw);
            addMessage(`Saya lihat Anda tertarik dengan posisi <strong>${contextData.jobTitle}</strong> (${contextData.jobData.score}% match).`, 'bot');
        }

        // Suggestions structure with Icons
        const defaultSuggestions = [
            { icon: "🎯", text: "Career Discovery", prompt: "Karir apa yang cocok untuk saya?" },
            { icon: "💰", text: "Informasi Gaji", prompt: "Berapa standar gaji untuk posisi ini?" },
            { icon: "🎤", text: "Persiapan Interview", prompt: "Bagaimana tips interview yang efektif?" },
            { icon: "📈", text: "Skill Development", prompt: "Skill apa yang perlu saya pelajari?" },
            { icon: "🔍", text: "Job Search", prompt: "Bagaimana strategi mencari kerja yang baik?" }
        ];

        const contextSuggestions = contextData ? [
            { icon: "🎯", text: `Skill untuk ${contextData.jobTitle}`, prompt: `Apa skill terpenting untuk ${contextData.jobTitle}?` },
            { icon: "💰", text: "Range Gaji", prompt: `Berapa range gaji untuk ${contextData.jobTitle}?` },
            { icon: "🎤", text: "Interview Tips", prompt: `Bagaimana cara menjawab pertanyaan interview ${contextData.jobTitle}?` },
            { icon: "📚", text: "Learning Path", prompt: `Bagaimana roadmap belajar untuk jadi ${contextData.jobTitle}?` },
            { icon: "⚠️", text: "Tantangan Karir", prompt: `Apa tantangan terbesar sebagai ${contextData.jobTitle}?` }
        ] : defaultSuggestions;

        // Render Suggestions List
        renderMenu(contextSuggestions);

        function renderMenu(items) {
            suggestionsPopup.innerHTML = items.map(item => `
                <div class="suggestion-item" onclick="sendQuickMessage('${item.prompt}')">
                    <span class="suggestion-icon">${item.icon}</span>
                    <span>${item.text}</span>
                </div>
            `).join('');
        }

        // Toggle Menu
        function toggleMenu() {
            const isShown = suggestionsPopup.classList.contains('show');
            if (isShown) {
                suggestionsPopup.classList.remove('show');
                menuBtn.classList.remove('active');
            } else {
                suggestionsPopup.classList.add('show');
                menuBtn.classList.add('active');
            }
        }

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!suggestionsPopup.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
                suggestionsPopup.classList.remove('show');
                menuBtn.classList.remove('active');
            }
        });

        // Theme Logic
        const themeToggle = document.getElementById('themeToggle');
        const icon = themeToggle.querySelector('.icon');

        if (document.body.getAttribute('data-theme') === 'dark') icon.textContent = '☀️';

        themeToggle.addEventListener('click', () => {
            const current = document.body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            icon.textContent = next === 'dark' ? '☀️' : '🌙';
        });

        // Chat Logic
        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            chatInput.value = '';
            suggestionsPopup.classList.remove('show'); // Auto close menu
            menuBtn.classList.remove('active');

            setLoading(true);

            fetch('http://localhost:5000/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, context: contextData })
            })
                .then(res => res.json())
                .then(data => {
                    removeTyping();
                    const response = data.source === 'ai' ? '✨ ' + data.response : data.response;
                    addMessage(response, 'bot');
                })
                .catch(err => {
                    removeTyping();
                    addMessage('Maaf, ada gangguan koneksi.', 'bot');
                })
                .finally(() => setLoading(false));
        }

        function sendQuickMessage(text) {
            chatInput.value = text;
            sendMessage();
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const avatar = sender === 'bot' ? '🤖' : '👤';
            div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${text}</div>`;
            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' });
        }

        function setLoading(isLoading) {
            sendBtn.disabled = isLoading;
            if (isLoading) showTyping();
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble typing">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            `;
            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function goBack() {
            const prev = sessionStorage.getItem('chatJobContext') ? 'job-detail.html' : 'result.html';
            window.location.href = prev;
        }

        // Enter key support
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Focus
        chatInput.focus();
    </script>
</body>

</html>
